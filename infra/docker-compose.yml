services:
  gateway:
    image: gateway-ng
    hostname: gateway-ng
    container_name: gateway
    restart: always
    build:
      context: nginx/
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - 8080:8080
    
  clothess-psql:
    image: postgres:17
    container_name: clothess-psql
    hostname: clothess-psql
    restart: always
    env_file:
      - .env
    ports:
      - 5432:5432
    
  clothess-webapi1:
    image: clothess-webapi1
    hostname: clothess-webapi1
    container_name: clothess-webapi1
    restart: always
    build:
      context: ../
      dockerfile: src/backend/Presenters/Clothess.WebApi/Dockerfile
    env_file:
      - .env